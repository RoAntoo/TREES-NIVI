name: Verificar NIVI
on:
  push:
    paths: ['backend/**', 'frontend/**', 'docs/contrato-api.yaml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'docs/contrato-api.yaml', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compilar, probar y validar OpenAPI
        working-directory: backend
        run: sh mvnw -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias desde el lockfile
        run: npm --prefix frontend ci
      - name: Verificar lint
        run: npm --prefix frontend run lint
      - name: Probar biblioteca, catálogo, lectura y copia local
        run: npm --prefix frontend test -- --watch=false
      - name: Probar configuración nativa
        run: npm --prefix frontend run test:scripts
      - name: Compilar cliente web
        run: npm --prefix frontend run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # El paquete tools ya no se distribuye; instalar solo platform-tools.
          packages: platform-tools
      - name: Preparar SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm --prefix frontend ci
      - name: Regenerar y compilar Android debug
        env:
          NIVI_API_URL: https://api.ejemplo.org/api/v1
        run: npm --prefix frontend run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: nivi-lectura-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
