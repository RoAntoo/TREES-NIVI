# Activar sólo detrás de restricciones IP de App Service: no hay login.
server:
  address: 0.0.0.0
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    locations: classpath:db/postgresql
